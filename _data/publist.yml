# Publication list for the RIA Lab.
# `highlight: 1` promotes an entry to the "Selected work" grid on the
# publications page. Add `image: filename.png` (in images/pubpic/) to show a
# thumbnail; entries without an image render fine.

- title: "Optimal Interactive Learning on the Job via Facility Location Planning"
  description: Collaborative robots must keep adapting to new tasks and user preferences without overburdening the person they work with. We cast multi-task interactive learning as a facility location problem, planning a sequence of human interventions that is near-optimal across a whole stream of tasks rather than greedy on the current one.
  authors: Shivam Vats, Michelle Zhao, Patrick Callaghan, Mingxi Jia, Maxim Likhachev, Oliver Kroemer, George Konidaris
  link:
    url: https://arxiv.org/abs/2505.00490
    display: Robotics&#58; Science and Systems (RSS), 2025
  highlight: 1

- title: "Conformalized Interactive Imitation Learning: Handling Expert Shift and Intermittent Feedback"
  description: Uncertainty quantification lets a robot ask for help when it leaves familiar territory — but standard conformal prediction assumes exchangeable data, which interactive imitation learning violates on two fronts. We give a calibration method that stays statistically valid when the expert's own behavior shifts and when feedback arrives only intermittently.
  authors: Michelle Zhao, Reid Simmons, Henny Admoni, Aaditya Ramdas, Andrea Bajcsy
  link:
    url: https://arxiv.org/abs/2410.08852
    display: International Conference on Learning Representations (ICLR), 2025
  highlight: 1

- title: "Conformalized Teleoperation: Confidently Mapping Human Inputs to High-Dimensional Robot Actions"
  description: Assistive arms have far more degrees of freedom than a joystick can express, so learned interfaces must guess at the operator's intent. We calibrate that mapping with conformal prediction, giving the robot a principled signal for when its inferred action is trustworthy and when it is not.
  authors: Michelle Zhao, Reid Simmons, Henny Admoni, Andrea Bajcsy
  link:
    url: https://arxiv.org/abs/2406.07767
    display: Robotics&#58; Science and Systems (RSS), 2025
  highlight: 1

- title: "Learning Human Contribution Preferences in Collaborative Human-Robot Tasks"
  description: People care not only about whether a task gets done but about which parts of it they do themselves. We model and learn these contribution preferences, so a robot can divide collaborative work in the way its partner actually wants.
  authors: Michelle D. Zhao, Reid Simmons, Henny Admoni
  link:
    url: https://proceedings.mlr.press/v229/zhao23b.html
    display: Conference on Robot Learning (CoRL), 2023
  highlight: 1

- title: "Multi-Agent Strategy Explanations for Human-Robot Collaboration"
  description: For people to coordinate with robots, they need an accurate picture of how the robot will act. We generate explanations of a joint multi-agent strategy and show they improve how well people can predict and work with a robot partner.
  authors: Ravi Pandya, Michelle Zhao, Changliu Liu, Reid Simmons, Henny Admoni
  link:
    url: https://arxiv.org/abs/2311.11955
    display: IEEE International Conference on Robotics and Automation (ICRA), 2024
  highlight: 1

- title: "Coordination with Humans via Strategy Matching"
  description: Rather than expecting people to adapt to the robot, we infer a partner's high-level strategy from a handful of observed actions and adapt the robot's policy to match it.
  authors: Michelle Zhao, Reid Simmons, Henny Admoni
  link:
    url: https://arxiv.org/abs/2210.15099
    display: IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS), 2022
  highlight: 1

- title: "Bi-Directional Mental Model Reconciliation for Human-Robot Interaction with Large Language Models"
