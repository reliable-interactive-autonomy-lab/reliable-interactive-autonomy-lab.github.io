# Lab news. Newest first. The nine most recent appear in the home-page
# sidebar; the full list is at /allnews.html.

- date: October 2026
  headline: "The lab presented two workshop papers at IROS 2026: Mihir at the [Human-Robot Dialogue workshop](https://human-robot-dialogue.github.io/) and Jiahe at the [Rethinking Uncertainty for Modern Robotics Paradigms workshop](https://rethinking-uncertainty.github.io/). "

- date: September 2026
  headline: Welcome to Sunny Qiao, JeongTak Cho, and Pradyumna Satheesh, who joined the lab as Master's student researchers!

- date: September 2026
  headline: "Jiahe Liu&rsquo;s paper, &ldquo;Show Me What You See: Analyzing Visuomotor Policy Attention for Human-Facing Feedback in Interactive Robot Learning,&rdquo; was accepted to the Rethinking Uncertainty for Modern Robotics Paradigms Workshop at IROS 2026. Well done, Jiahe!"

- date: September 2026
  headline: Mihir Parekh&rsquo;s paper, &ldquo;Why Did the Robot Fail? Causal Concept Bottlenecks for Failure Detection and Explanation,&rdquo; was accepted to the Human-Robot Dialogue Workshop at IROS 2026. Congratulations, Mihir!

- date: August 2026
  headline: The Reliable Interactive Autonomy Lab has officially launched at Indiana University Bloomington! We are [recruiting](/join/) PhD, Master's, and undergraduate students.

- date: August 2026
  headline: Welcome to Mihir Parekh and Jiahe Liu, who joined the lab as PhD students in Fall 2026!
